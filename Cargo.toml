[package]
name = "bytecodegen"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/playx18/bytecodegen"
documentation = "https://docs.rs/bytecodegen"

[workspace]
members = [".", "bytecodegen-core", "bytecodegen-macros"]

[dependencies]
bytecodegen-core = { path = "bytecodegen-core" }
bytecodegen-macros = { path = "bytecodegen-macros" }

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
proc-macro2 = "1.0.103"
quote = "1.0.41"
syn = { version = "2.0.108", features = ["full", "parsing", "extra-traits"] }
