[package]
name = "bytecodegen"
version = "0.2.0"
edition = "2024"
description = "Declare bytecode instruction schemas once and generate typed instructions, encoding, linking, verification, and disassembly"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/playx18/bytecodegen"
documentation = "https://docs.rs/bytecodegen"
keywords = ["bytecode", "codegen", "dsl", "macros", "vm"]
categories = ["development-tools", "compilers"]

[workspace]
members = [".", "bytecodegen-core", "bytecodegen-macros"]

[dependencies]
bytecodegen-core = { version = "0.2.0", path = "bytecodegen-core" }
bytecodegen-macros = { version = "0.2.0", path = "bytecodegen-macros" }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "opcode_execution"
harness = false

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
proc-macro2 = "1.0.103"
quote = "1.0.41"
syn = { version = "2.0.108", features = ["full", "parsing", "extra-traits"] }
bytecodegen-macros = { path = "bytecodegen-macros" }

[profile.bench]
lto = true
